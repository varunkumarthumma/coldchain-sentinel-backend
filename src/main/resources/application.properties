# ===================================================================
# ColdChain Sentinel - Core Application Configuration
# ===================================================================
spring.application.name=coldchain-sentinel
server.port=8080

# ===================================================================
# MySQL Database Configuration
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coldchain_sentinel}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Cold Chain Environmental Alert Thresholds (Demonstration Defaults)
# NOTE: Safe ranges vary by commodity (fruits, vegetables, vaccine cold chain).
# Adjust these values based on specific cold-storage operational profiles.
# ===================================================================
coldchain.thresholds.temperature-min=0.00
coldchain.thresholds.temperature-max=8.00
coldchain.thresholds.temperature-critical-delta=4.00

coldchain.thresholds.humidity-min=65.00
coldchain.thresholds.humidity-max=95.00
coldchain.thresholds.humidity-critical-delta=10.00

# ===================================================================
# Post-Harvest Loss Risk Assessment Configuration (Demonstration Defaults)
# NOTE: Experimental heuristic scoring weights and sampling parameters.
# Weights must sum approximately to 1.0.
# ===================================================================
coldchain.risk.weight-thermal-excursions=0.35
coldchain.risk.weight-humidity-excursions=0.25
coldchain.risk.weight-excursion-duration=0.20
coldchain.risk.weight-recent-alerts=0.20
coldchain.risk.min-readings-required=3
coldchain.risk.max-interval-minutes=120
coldchain.risk.moderate-threshold=25.00
coldchain.risk.elevated-threshold=55.00
coldchain.risk.critical-threshold=80.00

# ===================================================================
# Device Authentication & Ingestion Security
# Production defaults are strictly secure (false).
# Unprovisioned sensor ingestion and open token provisioning are rejected by default.
# ===================================================================
coldchain.security.allow-unprovisioned-sensors=${COLDCHAIN_ALLOW_UNPROVISIONED_SENSORS:false}
coldchain.security.allow-open-provisioning=${COLDCHAIN_ALLOW_OPEN_PROVISIONING:false}

