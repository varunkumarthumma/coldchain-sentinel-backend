
spring.application.name=coldchain-sentinel
server.port=${PORT:8080}

# Online PostgreSQL Database Configuration (Aiven Cloud / Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${DATABASE_URL:jdbc:postgresql://pg-2b63f250-coldstoragedatabase.b.aivencloud.com:21429/defaultdb?sslmode=require}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:avnadmin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# HikariCP Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Environmental Thresholds (Safe operational baseline)
coldchain.thresholds.temperature-min=0.00
coldchain.thresholds.temperature-max=8.00
coldchain.thresholds.temperature-critical-delta=4.00
coldchain.thresholds.humidity-min=65.00
coldchain.thresholds.humidity-max=95.00
coldchain.thresholds.humidity-critical-delta=10.00

# Post-Harvest Loss Risk Assessment Configuration
coldchain.risk.weight-thermal-excursions=0.35
coldchain.risk.weight-humidity-excursions=0.25
coldchain.risk.weight-excursion-duration=0.20
coldchain.risk.weight-recent-alerts=0.20
coldchain.risk.min-readings-required=3
coldchain.risk.max-interval-minutes=120
coldchain.risk.moderate-threshold=25.00
coldchain.risk.elevated-threshold=55.00
coldchain.risk.critical-threshold=80.00

# Device Security
coldchain.security.allow-unprovisioned-sensors=${COLDCHAIN_ALLOW_UNPROVISIONED_SENSORS:true}
coldchain.security.allow-open-provisioning=${COLDCHAIN_ALLOW_OPEN_PROVISIONING:true}

