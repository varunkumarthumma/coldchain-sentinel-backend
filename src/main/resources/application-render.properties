# Render Deployment Profile
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:pg-2b63f250-coldstoragedatabase.b.aivencloud.com}:${DB_PORT:21429}/${DB_NAME:defaultdb}?sslmode=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:avnadmin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

coldchain.security.allow-unprovisioned-sensors=true
coldchain.security.allow-open-provisioning=true