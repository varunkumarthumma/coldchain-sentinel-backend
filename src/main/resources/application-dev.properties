# ===================================================================
# ColdChain Sentinel - Local Development Profile Configuration
# Activate via: --spring.profiles.active=dev (or -Dspring.profiles.active=dev)
# ===================================================================

# Permit unprovisioned sensors to ingest telemetry so local simulators work seamlessly
coldchain.security.allow-unprovisioned-sensors=true

# Permit local developers to provision and rotate tokens via POST /api/sensors/{id}/token
coldchain.security.allow-open-provisioning=true
