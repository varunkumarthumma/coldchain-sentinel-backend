services:
  - type: web
    name: coldchain-sentinel-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        value: jdbc:postgresql://pg-2b63f250-coldstoragedatabase.b.aivencloud.com:21429/defaultdb?sslmode=require
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: COLDCHAIN_ALLOW_UNPROVISIONED_SENSORS
        value: "true"
      - key: COLDCHAIN_ALLOW_OPEN_PROVISIONING
        value: "true"
